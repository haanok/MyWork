# Example server block for the host's nginx in front of the MyWork compose
# stack. TLS terminates here; everything else goes to oauth2-proxy, which
# handles login and forwards authenticated requests to the app.
#
# Put these two directives in the http {} block (or in this server block)
# so the split oauth2-proxy session cookies fit:
#   large_client_header_buffers 4 32k;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mywork.example.com;

    ssl_certificate     /etc/letsencrypt/live/mywork.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywork.example.com/privkey.pem;

    # Session cookies can be large (oauth2-proxy splits them into chunks).
    large_client_header_buffers 4 32k;

    # Matches the app's 10 MB request body limit.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Response headers from oauth2-proxy (Set-Cookie chunks) can be large.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mywork.example.com;
    return 301 https://$host$request_uri;
}
