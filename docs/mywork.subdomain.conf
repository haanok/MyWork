# Example server block for the host's nginx (SWAG layout: /config/nginx/*.conf)
# in front of the MyWork compose stack. TLS terminates here; everything goes
# to oauth2-proxy, which handles login and forwards authenticated requests to
# the app. proxy.conf already sets Host and X-Forwarded-Proto/Host/For.
#
# The upstream is BIND_ADDRESS:PORT from .env (oauth2-proxy's published port).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mywork.x99.no;

    include /config/nginx/ssl.conf;

    # Matches the app's 10 MB request body limit.
    client_max_body_size 10m;

    # oauth2-proxy splits its session cookie into chunks; allow large headers.
    large_client_header_buffers 4 32k;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://10.0.0.100:4180;

        # Room for the large Set-Cookie headers from oauth2-proxy.
        proxy_buffer_size 16k;
    }
}
